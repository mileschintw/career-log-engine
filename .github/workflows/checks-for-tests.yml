# Runs the tests of tools/checks_for.py (which checks to run for the paths a change touched). They
# include the parity test: every workflow here runs on the same paths: and steps as its groups in the
# tool's map, so the job runs when any workflow changes, and when tools/export-template.sh does (the
# tool reads its ALLOW list). They include EveryImport too (#52), which reads the imports of every
# .py a check reaches, so the job also runs on a change to a .py in tools/, tools/tests/,
# maintainer/, maintainer/tests/ or docs/upgrades/, where a change can add or remove an import edge
# (#58); EveryImport's test_the_guard_runs_on_every_module_it_reads fails when it reads one elsewhere.
# Linux only (standing in for macOS), on the oldest Python SETUP.md supports (3.11): it matches path
# strings, and its one Windows case (a path on another drive) is left to the session that changes it,
# which runs these tests on its own platform too (SETUP.md step 7).
# This repo's own CI: never exported to the Template.
name: Checks-for tests

on:
  pull_request:
    paths:
      - "tools/export-template.sh"
      - ".github/workflows/**"
      - "tools/*.py"
      - "tools/tests/*.py"
      - "maintainer/*.py"
      - "maintainer/tests/*.py"
      - "docs/upgrades/*.py"
      - ".github/workflows/checks-for-tests.yml"

permissions:
  contents: read

# A new push to the same pull request cancels the run still going for the previous one
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run tools/tests/test_checks_for.py
        run: python -I tools/tests/test_checks_for.py -v

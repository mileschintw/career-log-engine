# Runs the tests of the Log's git steps (tools/sync.py: pull, commit, settle) on Linux (standing in
# for macOS) and Windows, the platforms the Log is developed on (SKILL.md › Platforms): they run git
# on the user's own Log, and git on Windows differs (line endings, file locks). Linux runs the oldest
# Python SETUP.md supports (3.11), Windows a current one.
# This repo's own CI: never exported to the Template.
name: Sync tests

on:
  pull_request:
    paths:
      - "tools/sync.py"
      - "tools/logfiles.py"
      - "tools/tests/test_sync.py"
      - ".github/workflows/sync-tests.yml"

permissions:
  contents: read

# A new push to the same pull request cancels the run still going for the previous one
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run tools/tests/test_sync.py
        run: python -I tools/tests/test_sync.py -v

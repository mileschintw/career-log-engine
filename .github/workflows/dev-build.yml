# Makes a Dev build on each push to master, a merged pull request's included: the export of that
# commit, committed to the builds branch and tagged v<next version>-dev.<n> (maintainer/devbuild.py,
# docs/publishing.md › Dev builds). It pushes only that branch and that tag, here; the Template never
# gets a Dev build. Its test, maintainer/tests/test_devbuild.py, runs in coord-tests.yml.
# Linux only, on the oldest Python SETUP.md supports (3.11): it runs no code of the user's machine.
# This repo's own CI: never exported to the Template.
name: Dev build

on:
  push:
    branches: [master]

# Writes the builds branch and a tag; nothing else
permissions:
  contents: write

# No concurrency group: GitHub keeps one pending run per group and drops the rest, so a merge would
# get no build. Runs at the same time race instead; the loser's atomic push is refused, and it builds
# again on top of the winner's, with the next <n>.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the tags, for the next <n>
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Make the Dev build and push it
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            # origin's tags and builds branch as they are now, dropping a tag a refused push left here
            git fetch -q --force --prune --prune-tags origin "+refs/tags/*:refs/tags/*"
            if git ls-remote --exit-code --heads origin builds > /dev/null; then
              git fetch -q --no-tags --force origin +refs/heads/builds:refs/heads/builds
            else
              git update-ref -d refs/heads/builds || true
            fi
            if python -I maintainer/devbuild.py . --push origin; then exit 0; fi
            sleep $((attempt * 10))
          done
          exit 1
